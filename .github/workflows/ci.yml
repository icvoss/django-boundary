name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.15.22"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # BR-ENV-004: every supported Python against every supported Django.
        # Both axes are read by AC-TEST-008, which parses this file and
        # compares them against the rule, so adding a version here without
        # adding it to BR-ENV-004 (or the reverse) fails the suite.
        python-version: ["3.12", "3.13"]
        django-version: ["5.2", "6.0", "6.1"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          POSTGRES_DB: boundary_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0"
          pip install pytest pytest-django pytest-cov factory-boy psycopg[binary]
          pip install -e .

      - name: Provision the non-superuser icv_app role for RLS enforcement tests
        # Without this role, tests/test_rls.py's app_conn fixture and
        # tests/test_checks.py's boundary.W003 "proven silent" test both
        # skip rather than run, because the icv_test bootstrap role from
        # the postgres:16 image is itself a BYPASSRLS superuser (this is
        # precisely the trap issue #21 documents). Skipping is not
        # equivalent to passing: run the role-dependent tests for real.
        run: |
          PGPASSWORD=icv_test_password psql -h localhost -p 5432 -U icv_test -d boundary_test -c \
            "CREATE ROLE icv_app LOGIN PASSWORD 'icv_dev' NOSUPERUSER NOBYPASSRLS;"
          PGPASSWORD=icv_test_password psql -h localhost -p 5432 -U icv_test -d boundary_test -c \
            "GRANT CONNECT ON DATABASE boundary_test TO icv_app; GRANT USAGE ON SCHEMA public TO icv_app;"

      - name: Run tests
        run: pytest tests/ -v --tb=short --color=yes
        env:
          DJANGO_SETTINGS_MODULE: settings
          PYTHONPATH: src:tests
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          POSTGRES_DB: boundary_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"

  test-postgres-14:
    # BR-ENV-001 supports PostgreSQL 14, 15 and 16, and a supported major
    # with no leg is an unverified claim rather than a supported
    # environment. 16 is covered by every leg of `test` above; this job and
    # the next cover the other two, on the oldest supported Django so the
    # oldest supported things are exercised together.
    #
    # Written as two jobs with literal image tags rather than one job with a
    # postgres-version matrix, because AC-TEST-008 reads the set of
    # postgres:<major> service images straight out of this file: a matrix
    # would leave "postgres:${{ matrix.postgres-version }}" there, which
    # names no major at all.
    name: Test (PostgreSQL 14, Python 3.12, Django 5.2)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          POSTGRES_DB: boundary_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=5.2.0"
          pip install pytest pytest-django pytest-cov factory-boy psycopg[binary]
          pip install -e .

      - name: Provision the non-superuser icv_app role for RLS enforcement tests
        # Same reason as the `test` job: without it the role-dependent tests
        # skip, and BR-ENV-006 requires zero skipped tests on every leg.
        run: |
          PGPASSWORD=icv_test_password psql -h localhost -p 5432 -U icv_test -d boundary_test -c \
            "CREATE ROLE icv_app LOGIN PASSWORD 'icv_dev' NOSUPERUSER NOBYPASSRLS;"
          PGPASSWORD=icv_test_password psql -h localhost -p 5432 -U icv_test -d boundary_test -c \
            "GRANT CONNECT ON DATABASE boundary_test TO icv_app; GRANT USAGE ON SCHEMA public TO icv_app;"

      - name: Run tests
        run: pytest tests/ -v --tb=short --color=yes
        env:
          DJANGO_SETTINGS_MODULE: settings
          PYTHONPATH: src:tests
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          POSTGRES_DB: boundary_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"

  test-postgres-15:
    # BR-ENV-001's middle supported major. See test-postgres-14 above for
    # why these are two jobs with literal image tags rather than a matrix.
    name: Test (PostgreSQL 15, Python 3.12, Django 5.2)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          POSTGRES_DB: boundary_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=5.2.0"
          pip install pytest pytest-django pytest-cov factory-boy psycopg[binary]
          pip install -e .

      - name: Provision the non-superuser icv_app role for RLS enforcement tests
        # Same reason as the `test` job: without it the role-dependent tests
        # skip, and BR-ENV-006 requires zero skipped tests on every leg.
        run: |
          PGPASSWORD=icv_test_password psql -h localhost -p 5432 -U icv_test -d boundary_test -c \
            "CREATE ROLE icv_app LOGIN PASSWORD 'icv_dev' NOSUPERUSER NOBYPASSRLS;"
          PGPASSWORD=icv_test_password psql -h localhost -p 5432 -U icv_test -d boundary_test -c \
            "GRANT CONNECT ON DATABASE boundary_test TO icv_app; GRANT USAGE ON SCHEMA public TO icv_app;"

      - name: Run tests
        run: pytest tests/ -v --tb=short --color=yes
        env:
          DJANGO_SETTINGS_MODULE: settings
          PYTHONPATH: src:tests
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          POSTGRES_DB: boundary_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"

  test-sqlite:
    # BR-ENV-006: the suite runs with SQLite as the `default` alias, proving
    # BR-ENV-002's quiet returns on a backend with no Row Level Security at
    # all. This is the backend consumers develop against locally, and until
    # this leg existed nothing had ever run there.
    #
    # The leg's test database builds only because tests/settings.py installs
    # a router denying allow_migrate() for thirdparty and boundary_consumer
    # on this alias. That is the live exercise of BR-RLS-013 and BR-RLS-021's
    # "a denied alias receives no DDL and no error", on a real migration
    # graph: remove the router and the consumer's adoption migration refuses
    # the SQLite alias by name and no test runs at all.
    name: Test (SQLite default, Python 3.12, Django 5.2)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # No psycopg: the point of this leg is a consumer's ordinary SQLite
        # checkout, and a missing driver is part of that shape.
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=5.2.0"
          pip install pytest pytest-django pytest-cov factory-boy
          pip install -e .

      - name: Run tests
        # -m "not rls" DESELECTS the tests that need a PostgreSQL RLS
        # backend, before collection finishes, rather than skipping them at
        # runtime. BR-ENV-006 makes that distinction load-bearing: a skipped
        # test is indistinguishable from a leg whose database or role never
        # materialised, which is the failure the zero-skipped rule exists to
        # catch, while a deselected test is named on the command line and
        # counted in the summary below.
        #
        # -rs prints the reason for any skip, so a reintroduced pytest.skip
        # is visible in the log and not only in the count.
        run: |
          set -o pipefail
          pytest tests/ -v --tb=short --color=yes -rs -m "not rls" | tee pytest-sqlite.log
        env:
          BOUNDARY_TEST_DB: sqlite
          DJANGO_SETTINGS_MODULE: settings
          PYTHONPATH: src:tests

      - name: Report collected, deselected and passed counts, and fail on any skip
        # BR-ENV-006: every leg reports zero skipped tests, read from the
        # pytest summary rather than from the exit code, because a leg whose
        # tests were collected and skipped has verified nothing. Deselected
        # is counted separately and is expected to be non-zero here; skipped
        # is not, and a single " skipped" in the summary line fails the leg.
        if: always()
        run: |
          echo "--- collection and outcome, from the pytest summary"
          grep -E "tests? collected|deselected" pytest-sqlite.log || true
          SUMMARY="$(grep -E "^=+ .*(passed|failed|error).* =+$" pytest-sqlite.log | tail -1)"
          echo "summary: ${SUMMARY}"
          if [[ -z "${SUMMARY}" ]]; then
            echo "ERROR: no pytest summary line found; the run did not complete."
            exit 1
          fi
          if [[ "${SUMMARY}" == *" skipped"* ]]; then
            echo "ERROR: this leg skipped tests. A skipped test has verified nothing and is"
            echo "indistinguishable from a leg whose environment never materialised"
            echo "(BR-ENV-006). Deselect it with the rls marker if it cannot apply on"
            echo "SQLite, or fix what made it skip."
            exit 1
          fi
          echo "Zero skipped tests on the SQLite leg."

  mypy:
    # ADR-027's typing leg, run against the package itself under the exact
    # mypy and django-stubs pair the dev extra declares.
    name: Typecheck (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the declared mypy and django-stubs pair
        # From the dev extra, so the pair stays a single source of truth
        # rather than a hand-list here that can rot away from it.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy on the package
        run: mypy src/boundary

  smoke-test:
    # ADR-027's consumer smoke gate, blocking on pull_request and push to
    # main. Stands up the throwaway consumer in smoke/consumer/ against the
    # package as an INSTALLED DISTRIBUTION (a built wheel in a clean venv,
    # never editable and never boundary's own bundled test app), and runs
    # what a real consumer runs. Both backends, because a migration or
    # typing defect can appear on only one.
    name: Consumer smoke test (ADR-027)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          POSTGRES_DB: boundary_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the wheel the consumer will install
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Confirm the smoke consumer is not in the wheel
        # The consumer is a CI fixture, not shipped code. setuptools finds
        # packages under src/ only, so smoke/ should never appear, but the
        # cost of proving it is one unzip and the cost of missing it is a
        # published wheel carrying a Django project.
        run: |
          unzip -l dist/*.whl | tee wheel-contents.txt
          if grep -qE "(^| )smoke/" wheel-contents.txt; then
            echo "ERROR: the smoke consumer is inside the built wheel."
            exit 1
          fi
          echo "The wheel does not carry smoke/."

      - name: Provision the non-superuser icv_app role
        # `manage.py check` runs boundary.W003, which reports when the
        # connecting role bypasses RLS. Connecting as the bootstrap
        # superuser would make the consumer's check output unrepresentative
        # of a real deployment, so the PostgreSQL pass connects as icv_app.
        run: |
          PGPASSWORD=icv_test_password psql -h localhost -p 5432 -U icv_test -d boundary_smoke -c \
            "CREATE ROLE icv_app LOGIN PASSWORD 'icv_dev' NOSUPERUSER NOBYPASSRLS;"
          PGPASSWORD=icv_test_password psql -h localhost -p 5432 -U icv_test -d boundary_smoke -c \
            "GRANT CONNECT ON DATABASE boundary_smoke TO icv_app;
             GRANT USAGE, CREATE ON SCHEMA public TO icv_app;"

      # ADR-027 steps 1 and 2, blocking on both backends: a migration defect
      # that appears on only one is the case the two passes exist for.
      - name: Smoke consumer on SQLite (makemigrations --check, migrate, check)
        run: smoke/run.sh sqlite
        env:
          BOUNDARY_SMOKE_WHEEL_GLOB: dist/*.whl

      - name: Smoke consumer on PostgreSQL (makemigrations --check, migrate, check)
        run: smoke/run.sh postgresql
        env:
          BOUNDARY_SMOKE_WHEEL_GLOB: dist/*.whl
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: boundary_smoke
          PGUSER: icv_app
          PGPASSWORD: icv_dev

      # ADR-027 step 3, kept in its own step (rather than folded into the
      # migration steps above) because it typechecks the CONSUMER against the
      # installed wheel, which is a different question from the `mypy
      # src/boundary` job's, and a failure should say which one broke.
      - name: Smoke consumer typing on SQLite (mypy)
        run: smoke/run.sh sqlite --mypy-only
        env:
          BOUNDARY_SMOKE_WHEEL_GLOB: dist/*.whl

      - name: Smoke consumer typing on PostgreSQL (mypy)
        run: smoke/run.sh postgresql --mypy-only
        env:
          BOUNDARY_SMOKE_WHEEL_GLOB: dist/*.whl
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: boundary_smoke
          PGUSER: icv_app
          PGPASSWORD: icv_dev
