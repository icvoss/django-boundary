name: Publish django-boundary to PyPI

# Triggered by tags of the form: v0.4.0
#
# OIDC trusted publishing — no API token is required in repository secrets.
# Configure trusted publishing in your PyPI project settings:
#   Publisher: GitHub Actions
#   Owner: icvoss
#   Repository: django-boundary
#   Workflow: publish.yml
#   Environment: pypi

on:
  push:
    tags:
      - "v*"

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PACKAGE_NAME: django-boundary

permissions:
  contents: write
  id-token: write

jobs:
  # 1. Parse version from the tag
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      release_title: ${{ steps.parse.outputs.release_title }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Could not parse version from tag '$TAG'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_title=django-boundary v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - uses: actions/checkout@v6

      - name: Require a CHANGELOG entry for this version
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          CHANGELOG="CHANGELOG.md"
          if [[ ! -f "$CHANGELOG" ]]; then
            echo "ERROR: $CHANGELOG does not exist. Every release must ship a CHANGELOG."
            exit 1
          fi
          # Require a heading like "## [0.4.0]" (date and surrounding text optional).
          if ! grep -qE "^##[[:space:]]+\[${VERSION//./\\.}\]" "$CHANGELOG"; then
            echo "ERROR: No CHANGELOG entry found for version ${VERSION} in $CHANGELOG."
            echo "Add a '## [${VERSION}] - <date>' section (rename [Unreleased]) before tagging."
            echo "See RELEASING.md - every release must ship a dated CHANGELOG entry."
            exit 1
          fi
          echo "Found CHANGELOG entry for ${VERSION}."

  # 2. Run the test suite before publishing
  test:
    name: Test django-boundary
    runs-on: ubuntu-latest
    needs: resolve

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          POSTGRES_DB: boundary_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Gate on the ARTEFACT, not the source tree (icvoss/icv-oss-umbrella#543).
      # An editable install puts src/ on sys.path, so the suite runs against
      # the working tree and never touches the wheel being published: a module
      # missing from packages.find, an absent py.typed, a template or data file
      # left out of the wheel, all pass every leg and ship broken. Build the
      # wheel here and install THAT.
      - name: Build the wheel this job will test
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Install the built wheel and test dependencies
        run: |
          # The package comes from the wheel; the `[dev]` extra resolves its
          # own test dependencies (and the package's declared runtime deps),
          # so `[dev]` stays the single source of truth and cannot rot the
          # way a hand-listed set does. A hand-list predating an API layer is
          # exactly how icv-identity's v0.6.0rc1 publish gate failed.
          pip install "$(ls dist/*.whl)[dev]"
          pip install "Django~=5.2.0"

      - name: Provision the non-superuser icv_app role for RLS enforcement tests
        # See ci.yml: the icv_test bootstrap role from the postgres:16
        # image is itself a BYPASSRLS superuser, so role-dependent tests
        # (app_conn fixture, boundary.W003 "proven silent" test) skip
        # without this role. A release must not publish on a suite where
        # RLS enforcement was never actually exercised.
        run: |
          PGPASSWORD=icv_test_password psql -h localhost -p 5432 -U icv_test -d boundary_test -c \
            "CREATE ROLE icv_app LOGIN PASSWORD 'icv_dev' NOSUPERUSER NOBYPASSRLS;"
          PGPASSWORD=icv_test_password psql -h localhost -p 5432 -U icv_test -d boundary_test -c \
            "GRANT CONNECT ON DATABASE boundary_test TO icv_app; GRANT USAGE ON SCHEMA public TO icv_app;"

      # THE TRAP, read before editing either line below. Installing the wheel
      # is NOT sufficient on its own. Two separate mechanisms put src/ ahead of
      # site-packages, and this repo uses both:
      #
      #   1. `PYTHONPATH: src:tests` in this job's env block
      #   2. `pythonpath = ["src", "tests"]` under [tool.pytest.ini_options]
      #
      # If either survives, pytest imports src/ and this job tests the source
      # tree while appearing to test the wheel. Below, PYTHONPATH drops `src`
      # and `-o pythonpath=tests` overrides the pyproject setting. The guard
      # step then fails the job if the package still resolves outside
      # site-packages, so a future edit that reintroduces either cannot pass
      # silently.
      - name: Confirm pytest resolves the package from the wheel
        run: |
          cat > _wheel_guard.py <<'PY'
          import os

          import boundary


          def test_package_resolves_from_the_installed_wheel():
              origin = os.path.realpath(boundary.__file__)
              assert "site-packages" in origin, (
                  f"the source tree shadowed the wheel: {origin}"
              )
          PY
          python -m pytest _wheel_guard.py -q -o pythonpath=tests
          rm _wheel_guard.py
        env:
          DJANGO_SETTINGS_MODULE: settings
          PYTHONPATH: tests

      - name: Run tests
        run: pytest tests/ -v --tb=short --color=yes -o pythonpath=tests
        env:
          DJANGO_SETTINGS_MODULE: settings
          PYTHONPATH: tests
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          POSTGRES_DB: boundary_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"

  # 3. Build wheel and sdist
  build:
    name: Build django-boundary
    runs-on: ubuntu-latest
    needs: [resolve, test]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distributions with twine
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-django-boundary-${{ needs.resolve.outputs.version }}
          path: dist/
          if-no-files-found: error

  # 4. Publish to PyPI via OIDC trusted publishing
  publish:
    name: Publish django-boundary to PyPI
    runs-on: ubuntu-latest
    needs: [resolve, build]
    environment: pypi

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-django-boundary-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true

  # 5. Create GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, publish]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-django-boundary-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.resolve.outputs.release_title }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ startsWith(needs.resolve.outputs.version, '0.') }}
          fail_on_unmatched_files: true
