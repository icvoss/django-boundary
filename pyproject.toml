[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-boundary"
version = "0.9.0"
description = "Scalable row-level multi-tenancy for Django with PostgreSQL RLS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "ICV", email = "dev@icv.dev"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "Django>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "psycopg[binary]>=3.1",
    "ruff>=0.5.0",
    "django-stubs[compatible-mypy]>=5.1,<6",
]

[project.urls]
"Homepage" = "https://github.com/icvoss/django-boundary"
"Source Code" = "https://github.com/icvoss/django-boundary"
"Changelog" = "https://github.com/icvoss/django-boundary/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/icvoss/django-boundary/issues"
"Documentation" = "https://github.com/icvoss/django-boundary/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boundary = ["py.typed"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings"
pythonpath = ["src", "tests"]
markers = [
    # A test that cannot apply on a backend without Row Level Security, so
    # the SQLite leg of the CI matrix deselects it with -m "not rls"
    # (BR-ENV-006). Deselection, not pytest.skip: a skipped test is
    # indistinguishable from a leg whose database or role never materialised,
    # which is the failure the zero-skipped rule exists to catch.
    "rls: requires a PostgreSQL RLS backend (deselected on the SQLite leg)",
]

[tool.mypy]
python_version = "3.12"
# ADR-027 declares the exact pair the package typechecks clean against, and
# the dev extra pins it: mypy 1.19.x with django-stubs[compatible-mypy] 5.2.x.
plugins = ["mypy_django_plugin.main"]
# The plugin needs a Django settings module it can import and call
# django.setup() with. tests/settings.py is the one this repo already has;
# mypy_path puts tests/ on the path so "settings" resolves, matching
# DJANGO_SETTINGS_MODULE elsewhere in the repo.
mypy_path = "tests"

# The plugin calls django.setup(), so it loads every app in INSTALLED_APPS,
# which pulls the test project's own models into the check. Those are test
# fixtures, not shipped code, and ADR-027's criterion is "mypy src/boundary
# reports no error on the package itself"; silence them so the job's exit
# status is about src/boundary.
[[tool.mypy.overrides]]
module = ["boundary_testapp.*", "boundary_consumer.*", "thirdparty.*", "settings", "urls", "sqlite_leg"]
follow_imports = "silent"
ignore_errors = true

# celery is an optional integration (boundary.celery guards its import), so a
# checkout without celery installed must not fail on a missing stub.
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "settings"

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/testing/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
extend-exclude = [
    # Django wrote these, and `makemigrations --check` in the ADR-027 smoke
    # gate compares against what Django would write, so reformatting them
    # would put the formatter and the gate in permanent disagreement.
    "smoke/consumer/*/migrations/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "DJ",  # flake8-django
]
ignore = [
    "E501",   # line length handled by the formatter
    "N806",   # User = get_user_model() is standard Django convention
    "SIM105", # contextlib.suppress less readable than try/except/pass for DoesNotExist
]

[tool.ruff.lint.isort]
known-first-party = ["boundary"]

[tool.ruff.format]
quote-style = "double"
