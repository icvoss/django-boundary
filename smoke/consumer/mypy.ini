; mypy for the smoke consumer, under the exact pair ADR-027 declares and
; boundary's dev extra pins: mypy 1.19.x with django-stubs 5.2.x.
;
; This is the leg that catches the package failing to typecheck clean in a
; consumer (ADR-027 defect 2): errors reported here are rooted in
; django-boundary, not in the eight lines of consumer code above.
[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = settings

[mypy-smokeapp.migrations.*]
; Generated files, not hand-written consumer code.
ignore_errors = True
